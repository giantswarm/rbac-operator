provider: ""

ciliumNetworkPolicy:
  enabled: false

image:
  name: "giantswarm/rbac-operator"

pod:
  user:
    id: 1000
  group:
    id: 1000

registry:
  domain: gsoci.azurecr.io

oidc:
  customer:
    write_all_group: ""
    write_all_groups: []
    read_all_groups: []
  giantswarm:
    write_all_group: ""
    write_all_groups: []

# Add seccomp to pod security context
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

# Add seccomp to container security context
securityContext:
  seccompProfile:
    type: RuntimeDefault

serviceMonitor:
  enabled: true
  # -- (duration) Prometheus scrape interval.
  interval: "60s"
  # -- (duration) Prometheus scrape timeout.
  scrapeTimeout: "45s"

global:
  podSecurityStandards:
    enforced: true

# -- Target CPU architecture for this workload. Empty imposes no constraint.
# `arm64` pins the pod to arm64 nodes, adding both the `kubernetes.io/arch`
# node selector and the toleration for the `kubernetes.io/arch=arm64:NoSchedule`
# taint that Giant Swarm arm64 node pools carry. Both are required, so this
# single value sets both. Requires a multi-arch container image; an amd64-only
# image will crash-loop with `exec format error` on an arm64 node. Do not also
# constrain `kubernetes.io/arch` through `affinity`: a `nodeAffinity` is ANDed
# with the node selector and is not visible to this value, so a contradicting
# one leaves the pod Pending.
architecture: ""

# -- Node selector for pod scheduling. Merged with `architecture`. Pinning to
# arm64 here rather than through `architecture` also adds the arm64 taint
# toleration, so either route is safe. A value that contradicts `architecture`
# fails the render.
nodeSelector: {}

# -- Tolerations for pod scheduling
tolerations: []
